name: Bot Town Cloud Runner

on:
  workflow_dispatch:
  schedule:
    # Fallback cron every 3 hours
    - cron: '0 */3 * * *'

permissions:
  actions: write
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Bot Town 5-in-1 Syndicate
        env:
          BOTTOWN_TOKEN: ${{ secrets.BOTTOWN_TOKEN }}
          BOTTOWN_TEAM: ${{ secrets.BOTTOWN_TEAM }}
        run: |
          python -u runner.py

      - name: Chain next run automatically
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run runner.yml || true
